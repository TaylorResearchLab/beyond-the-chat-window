<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">User-mediated collaboration workflow</title>
  <desc id="desc">GPT and Claude read and write shared project state in Notion. The User prompts and reviews both agents, governs accepted state, controls GitHub merge, and exclusively authorizes protected execution. Dashed lines indicate permission-dependent repository inspection and change proposals. Neither agent connects directly to protected compute.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#303030"/>
    </marker>
    <marker id="artifact-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5c6670"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .node-title { font-size: 25px; font-weight: 700; }
      .node-sub { font-size: 16px; }
      .edge { stroke: #303030; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .shared { stroke: #303030; stroke-width: 2.4; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .artifact { stroke: #5c6670; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-start: url(#artifact-arrow); marker-end: url(#artifact-arrow); }
      .edge-label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #303030; text-anchor: middle; }
      .artifact-label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #5c6670; text-anchor: middle; }
      .legend { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #444444; }
    </style>
  </defs>

  <rect x="40" y="55" width="280" height="125" rx="16" fill="#f7f7f7" stroke="#222222" stroke-width="2.5"/>
  <text x="180" y="104" class="label node-title">GPT</text>
  <text x="180" y="137" class="label node-sub">reasoning, coding, review</text>
  <text x="180" y="162" class="label node-sub">and sandbox testing</text>

  <rect x="430" y="50" width="340" height="145" rx="16" fill="#e9eef3" stroke="#222222" stroke-width="2.5"/>
  <text x="600" y="98" class="label node-title">NOTION</text>
  <text x="600" y="131" class="label node-sub">Collaboration Log, notebooks</text>
  <text x="600" y="156" class="label node-sub">handoffs and canonical state</text>
  <text x="600" y="181" class="label node-sub">review routing and decisions</text>

  <rect x="880" y="55" width="280" height="125" rx="16" fill="#f7f7f7" stroke="#222222" stroke-width="2.5"/>
  <text x="1020" y="104" class="label node-title">CLAUDE</text>
  <text x="1020" y="137" class="label node-sub">reasoning, coding, review</text>
  <text x="1020" y="162" class="label node-sub">and sandbox testing</text>

  <rect x="420" y="300" width="360" height="170" rx="18" fill="#ffffff" stroke="#111111" stroke-width="4"/>
  <text x="600" y="352" class="label node-title">USER</text>
  <text x="600" y="385" class="label node-sub">scientific lead and collaborator</text>
  <text x="600" y="410" class="label node-sub">project manager and adjudicator</text>
  <text x="600" y="435" class="label node-sub">custody and release authority</text>

  <rect x="450" y="620" width="300" height="130" rx="16" fill="#f2f2f2" stroke="#222222" stroke-width="2.5"/>
  <text x="600" y="667" class="label node-title">GITHUB</text>
  <text x="600" y="700" class="label node-sub">code, manuscript, commits</text>
  <text x="600" y="725" class="label node-sub">pull requests and CI</text>

  <rect x="840" y="620" width="320" height="130" rx="16" fill="#e6e6e6" stroke="#222222" stroke-width="2.5"/>
  <text x="1000" y="661" class="label node-title">PROTECTED</text>
  <text x="1000" y="691" class="label node-title">COMPUTE</text>
  <text x="1000" y="723" class="label node-sub">private data and authoritative runs</text>

  <path d="M320,108 L430,108" class="shared"/>
  <text x="375" y="87" class="edge-label">read / write</text>
  <text x="375" y="103" class="edge-label">shared state</text>

  <path d="M770,108 L880,108" class="shared"/>
  <text x="825" y="87" class="edge-label">read / write</text>
  <text x="825" y="103" class="edge-label">shared state</text>

  <path d="M445,325 C370,295 300,235 265,180" class="edge"/>
  <text x="340" y="250" class="edge-label">prompt / assign</text>
  <path d="M215,180 C270,260 345,325 420,365" class="edge"/>
  <text x="290" y="335" class="edge-label">analysis / review</text>

  <path d="M755,325 C830,295 900,235 935,180" class="edge"/>
  <text x="860" y="250" class="edge-label">prompt / assign</text>
  <path d="M985,180 C930,260 855,325 780,365" class="edge"/>
  <text x="910" y="335" class="edge-label">analysis / review</text>

  <path d="M585,300 L585,195" class="edge"/>
  <text x="535" y="252" class="edge-label">govern state</text>
  <path d="M615,195 L615,300" class="edge"/>
  <text x="670" y="252" class="edge-label">history / queue</text>

  <path d="M585,470 L585,620" class="edge"/>
  <text x="525" y="550" class="edge-label">review / merge</text>
  <path d="M615,620 L615,470" class="edge"/>
  <text x="675" y="550" class="edge-label">diffs / CI</text>

  <path d="M780,420 C870,465 1025,540 1070,620" class="edge"/>
  <text x="1010" y="535" class="edge-label">authorize / execute</text>
  <path d="M900,620 C855,555 800,505 760,455" class="edge"/>
  <text x="835" y="575" class="edge-label">authoritative results</text>

  <path d="M145,180 C30,350 115,555 485,640" class="artifact"/>
  <text x="105" y="400" class="artifact-label">inspect / propose</text>
  <text x="105" y="418" class="artifact-label">repository changes</text>

  <path d="M1055,180 C1170,350 1090,525 715,640" class="artifact"/>
  <text x="1095" y="400" class="artifact-label">inspect / propose</text>
  <text x="1095" y="418" class="artifact-label">repository changes</text>

  <line x1="420" y1="790" x2="470" y2="790" class="edge"/>
  <text x="480" y="795" class="legend">governance or evidence flow</text>
  <line x1="725" y1="790" x2="775" y2="790" class="artifact"/>
  <text x="785" y="795" class="legend">permission-dependent repository interaction</text>
</svg>
