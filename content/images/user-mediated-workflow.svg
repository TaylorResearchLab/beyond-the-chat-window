<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">User-mediated collaboration workflow</title>
  <desc id="desc">GPT and Claude read and write shared project state in Notion. The User prompts and reviews both agents, governs accepted state, controls GitHub merge, and exclusively authorizes protected execution. Neither agent connects directly to protected compute.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#303030"/>
    </marker>
    <style>
      .label { font-family: Arial, Helvetica, sans-serif; fill: #111111; text-anchor: middle; }
      .node-title { font-size: 25px; font-weight: 700; }
      .node-sub { font-size: 16px; }
      .edge { stroke: #303030; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .shared { stroke: #303030; stroke-width: 2.4; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
      .edge-label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #303030; text-anchor: middle; }
    </style>
  </defs>

  <rect x="40" y="55" width="280" height="125" rx="16" fill="#f7f7f7" stroke="#222222" stroke-width="2.5"/>
  <text x="180" y="104" class="label node-title">GPT</text>
  <text x="180" y="137" class="label node-sub">reasoning, coding, review</text>
  <text x="180" y="162" class="label node-sub">and sandbox testing</text>

  <rect x="430" y="50" width="340" height="145" rx="16" fill="#e9eef3" stroke="#222222" stroke-width="2.5"/>
  <text x="600" y="98" class="label node-title">NOTION</text>
  <text x="600" y="131" class="label node-sub">Collaboration Log, notebooks</text>
  <text x="600" y="156" class="label node-sub">handoffs and canonical state</text>
  <text x="600" y="181" class="label node-sub">review routing and decisions</text>

  <rect x="880" y="55" width="280" height="125" rx="16" fill="#f7f7f7" stroke="#222222" stroke-width="2.5"/>
  <text x="1020" y="104" class="label node-title">CLAUDE</text>
  <text x="1020" y="137" class="label node-sub">reasoning, coding, review</text>
  <text x="1020" y="162" class="label node-sub">and sandbox testing</text>

  <rect x="420" y="290" width="360" height="170" rx="18" fill="#ffffff" stroke="#111111" stroke-width="4"/>
  <text x="600" y="342" class="label node-title">USER</text>
  <text x="600" y="375" class="label node-sub">scientific lead and collaborator</text>
  <text x="600" y="400" class="label node-sub">project manager and adjudicator</text>
  <text x="600" y="425" class="label node-sub">custody and release authority</text>

  <rect x="100" y="575" width="300" height="130" rx="16" fill="#f2f2f2" stroke="#222222" stroke-width="2.5"/>
  <text x="250" y="622" class="label node-title">GITHUB</text>
  <text x="250" y="655" class="label node-sub">code, manuscript, commits</text>
  <text x="250" y="680" class="label node-sub">pull requests and CI</text>

  <rect x="800" y="575" width="320" height="130" rx="16" fill="#e6e6e6" stroke="#222222" stroke-width="2.5"/>
  <text x="960" y="616" class="label node-title">PROTECTED</text>
  <text x="960" y="646" class="label node-title">COMPUTE</text>
  <text x="960" y="678" class="label node-sub">private data and authoritative runs</text>

  <path d="M320,108 L430,108" class="shared"/>
  <text x="375" y="87" class="edge-label">read / write</text>
  <text x="375" y="103" class="edge-label">shared state</text>

  <path d="M770,108 L880,108" class="shared"/>
  <text x="825" y="87" class="edge-label">read / write</text>
  <text x="825" y="103" class="edge-label">shared state</text>

  <path d="M445,315 C370,285 300,230 265,180" class="edge"/>
  <text x="340" y="245" class="edge-label">prompt / assign</text>
  <path d="M215,180 C270,255 345,315 420,355" class="edge"/>
  <text x="290" y="325" class="edge-label">analysis / review</text>

  <path d="M755,315 C830,285 900,230 935,180" class="edge"/>
  <text x="860" y="245" class="edge-label">prompt / assign</text>
  <path d="M985,180 C930,255 855,315 780,355" class="edge"/>
  <text x="910" y="325" class="edge-label">analysis / review</text>

  <path d="M585,290 L585,195" class="edge"/>
  <text x="520" y="244" class="edge-label">govern state</text>
  <path d="M615,195 L615,290" class="edge"/>
  <text x="683" y="244" class="edge-label">history / queue</text>

  <path d="M470,440 C395,490 330,535 285,575" class="edge"/>
  <text x="365" y="510" class="edge-label">review / merge</text>
  <path d="M220,575 C275,520 345,470 430,420" class="edge"/>
  <text x="300" y="550" class="edge-label">diffs / CI</text>

  <path d="M730,440 C805,490 870,535 915,575" class="edge"/>
  <text x="835" y="510" class="edge-label">authorize / execute</text>
  <path d="M980,575 C925,520 855,470 770,420" class="edge"/>
  <text x="900" y="550" class="edge-label">authoritative results</text>
</svg>
